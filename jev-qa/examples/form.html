<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Jev QA local fixture</title>
<style>body{font:18px system-ui;max-width:620px;margin:60px auto}label,input,button{display:block;margin:16px 0}input,button{font:inherit;padding:12px}#status{padding:16px;background:#eee}</style>
<h1>Fictional newsletter signup</h1>
<p>This local page stores no information and sends no requests.</p>
<form novalidate>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="off">
  <button type="submit">Subscribe</button>
</form>
<p id="status" role="status">Waiting for submission.</p>
<p hidden id="hidden-success">Subscription saved.</p>
<script>
document.querySelector('form').addEventListener('submit', event => {
  event.preventDefault();
  const value = document.querySelector('#email').value;
  const broken = new URLSearchParams(location.search).has('broken');
  document.querySelector('#status').textContent = !value && !broken
    ? 'Email is required.' : 'Subscription saved.';
});
</script>
</html>
