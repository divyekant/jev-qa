[project]
name = "jev-qa"
version = "0.2.0"
description = "Bounded browser QA and evidence review with Jev"
requires-python = ">=3.12"
dependencies = [
  "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast.git@452c1ad2dd628008f1d5608f28158d76e49e6cc0",
]

[project.scripts]
jev-qa = "jev_qa.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
